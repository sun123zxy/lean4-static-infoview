<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean Static InfoView</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.min.css">
    <style>
        .hljs-sorry {
            color: #f48771;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <input type="file" id="file-input" accept=".html" style="display: none;">
    
    <div id="container">
        <div id="toolbar">
            <button id="change-file-btn" class="toolbar-btn">Load Static Info</button>
            <span id="current-file-name"></span>
        </div>
        <div id="main-content">
            <div id="code-panel">
                <div id="instructions">
                    Click on any goal marker or use arrow keys to navigate. The info panel shows tactic states.
                </div>
                <div id="code-content"></div>
            </div>
            <div id="resize-handle"></div>
            <div id="info-panel">
                <div class="info-title">Lean InfoView</div>
                <div id="info-content" class="info-empty">
                    Click on the code to see information
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://unpkg.com/highlightjs-lean/dist/lean.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
