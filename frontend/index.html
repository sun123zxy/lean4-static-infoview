<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean 4 Static InfoView</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.min.css">
    <style>
        .hljs-sorry {
            color: #f48771;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <input type="file" id="file-input" accept=".html" style="display: none;">
    
    <div id="container">
        <div id="toolbar">
            <button id="change-file-btn" class="toolbar-btn">Load Static Info</button>
            <span id="current-file-name"></span>
            <h1 id="app-title">Lean 4 Static Infoview</h1>
            <a href="https://github.com/sun123zxy/lean4-static-infoview" target="_blank" rel="noopener noreferrer" id="github-link" title="View on GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
        </div>
        <div id="main-content">
            <div id="code-panel">
                <div id="code-content"></div>
            </div>
            <div id="resize-handle"></div>
            <div id="info-panel">
                <div id="info-content" class="info-empty">
                    Click on the code to see information
                </div>
            </div>
        </div>
        <div id="display-toggles">
            <label>
                <input type="checkbox" id="toggle-goals" checked>
                <span>Goals</span>
            </label>
            <label>
                <input type="checkbox" id="toggle-terms" checked>
                <span>Terms</span>
            </label>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://unpkg.com/highlightjs-lean/dist/lean.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
